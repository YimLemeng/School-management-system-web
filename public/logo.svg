<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#schoolGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Academy Logo Elements -->
  <g filter="url(#badgeShadow)">
    <!-- Mortarboard Diamond Top -->
    <polygon points="32,13 54,22.5 32,32 10,22.5" fill="#ffffff" />

    <!-- Cap Base (Skull Cap Arc) -->
    <path d="M19 27.5 V33.5 C19 39 45 39 45 33.5 V27.5" fill="#f8fafc" />
    <path d="M22.5 29 V33.5 C22.5 37 41.5 37 41.5 33.5 V29" fill="#e2e8f0" />

    <!-- Gold Tassel -->
    <circle cx="32" cy="22.5" r="2.2" fill="url(#goldTassel)" />
    <path d="M32 22.5 Q46 23.5 48.5 31" stroke="url(#goldTassel)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <polygon points="46.5,31 50.5,31 49.5,38.5 47.5,38.5" fill="url(#goldTassel)" />
    <circle cx="48.5" cy="39" r="1.2" fill="url(#goldTassel)" />

    <!-- Open Book Symbol Below -->
    <!-- Left Page -->
    <path d="M32 44.5 C26.5 41.5 20 41.5 14 43.5 C13.4 43.7 13 44.2 13 44.8 L13 49 C13 49.6 13.5 50.1 14.1 49.9 C19.5 48.2 25.5 48.2 31 51.5 L32 52 Z" fill="#ffffff" opacity="0.95" />
    <!-- Right Page -->
    <path d="M32 44.5 C37.5 41.5 44 41.5 50 43.5 C50.6 43.7 51 44.2 51 44.8 L51 49 C51 49.6 50.5 50.1 49.9 49.9 C44.5 48.2 38.5 48.2 33 51.5 L32 52 Z" fill="#ffffff" opacity="0.95" />
    <!-- Spine Line -->
    <line x1="32" y1="44.5" x2="32" y2="52" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
